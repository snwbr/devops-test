---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ct-frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: ct-frontend
    spec:
      containers:
      - name: ct-frontend
        image: gcr.io/PROJECT_ID/IMAGE:TAG
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 512M
          limits:
            cpu: 200m
            memory: 512M
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              key: BACKEND_URL
              name: clevertech-vars
        - name: PORT
          valueFrom:
            configMapKeyRef:
              key: FE_PORT
              name: clevertech-vars
