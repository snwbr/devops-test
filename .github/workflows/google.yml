# This workflow will build a docker container, publish it to Google Container Registry, and deploy it to GKE when a release is created
#
# To configure this workflow:
#
# 1. Ensure that your repository contains the necessary configuration for your Google Kubernetes Engine cluster, including deployment.yml, kustomization.yml, service.yml, etc.
#
# 2. Set up secrets in your workspace: GKE_PROJECT with the name of the project and GKE_SA_KEY with the Base64 encoded JSON service account key (https://github.com/GoogleCloudPlatform/github-actions/tree/docs/service-account-key/setup-gcloud#inputs).
#
# 3. Change the values for the GKE_ZONE, GKE_CLUSTER, IMAGE, and DEPLOYMENT_NAME environment variables (below).
#
# For more support on how to run the workflow, please visit https://github.com/GoogleCloudPlatform/github-actions/tree/master/example-workflows/gke

name: Build and Deploy to GKE

on:
  push:
    branches:
    - main

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Set the env values
      run: |
          echo "PROJECT_ID=${{ secrets.GKE_PROJECT }}" >> $GITHUB_ENV
          echo 'GKE_CLUSTER=clevertech-gke' >> $GITHUB_ENV
          echo 'GKE_ZONE=us-east1-d' >> $GITHUB_ENV
          echo 'FE_DEPLOYMENT_NAME=ct-frontend' >> $GITHUB_ENV
          echo 'BE_DEPLOYMENT_NAME=ct-backend' >> $GITHUB_ENV
          echo 'FE_IMAGE=ct-frontend' >> $GITHUB_ENV
          echo 'BE_IMAGE=ct-backend' >> $GITHUB_ENV
          
    - name: Checkout
      uses: actions/checkout@v2

    # Setup gcloud CLI
    - uses: GoogleCloudPlatform/github-actions/setup-gcloud@v0.2.0
      with:
        service_account_key: ${{ secrets.GKE_SA_KEY }}
        project_id: ${{ secrets.GKE_PROJECT }}

    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker

    # Get the GKE credentials so we can deploy to the cluster
    - run: |-
        gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GKE_ZONE"

    # Build the Docker image
    - name: Build FE
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$FE_IMAGE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
           frontend/

    # Build the Docker image
    - name: Build BE
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$BE_IMAGE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
           backend/

    # Push the Docker image to Google Container Registry
    - name: Publish images
      run: |-
        docker push "gcr.io/$PROJECT_ID/$FE_IMAGE:$GITHUB_SHA" && \
        docker push "gcr.io/$PROJECT_ID/$BE_IMAGE:$GITHUB_SHA"

    # Deploy the Docker images to the GKE cluster
    - name: Deploy
      run: |-
        cd k8s/overlays

        cd db
        ./kustomize build . | kubectl apply -f -
        
        cd ../fe
        ./kustomize edit set image gcr.io/PROJECT_ID/IMAGE:TAG=gcr.io/$PROJECT_ID/$FE_IMAGE:$GITHUB_SHA
        ./kustomize build . | kubectl apply -f -

        cd ../be
        ./kustomize edit set image gcr.io/PROJECT_ID/IMAGE:TAG=gcr.io/$PROJECT_ID/$BE_IMAGE:$GITHUB_SHA
        ./kustomize build . | kubectl apply -f -
        
        kubectl rollout status deployment/postgresql
        kubectl rollout status deployment/$FE_DEPLOYMENT_NAME
        kubectl rollout status deployment/$BE_DEPLOYMENT_NAME
        
        kubectl get services -o wide
